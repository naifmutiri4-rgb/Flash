<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0B0A12">
<title>فلاش المالية · زجاج الليل</title>
<link rel="stylesheet" href="../core.css">
<style>
body{min-height:100vh}
.orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orbs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.orbs i:nth-child(1){width:340px;height:340px;background:var(--pk);top:-80px;right:-90px}
.orbs i:nth-child(2){width:300px;height:300px;background:var(--cy);bottom:10%;left:-120px;opacity:.35}
.orbs i:nth-child(3){width:220px;height:220px;background:#7C5CFF;top:45%;right:-60px;opacity:.35}
.glass{background:linear-gradient(140deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12)}
.lock{background:radial-gradient(120% 80% at 50% 0%,rgba(255,61,127,.25),transparent 60%),rgba(11,10,18,.55);backdrop-filter:blur(6px)}
.lock .logo{width:180px}
.lock h1{font-size:20px;font-weight:700}
.lock .card{padding:26px 22px;display:flex;flex-direction:column;align-items:center;gap:20px}
main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:54px 16px 40px;opacity:0}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.top img{height:34px}
.chip{font-size:12px;color:var(--mut);padding:6px 12px;border-radius:20px}
.hero{padding:22px 20px;position:relative;overflow:hidden}
.hero .l{font-size:13px;color:var(--mut)}
.hero .v{font-size:46px;font-weight:700;line-height:1.15;margin:4px 0 2px;background:none;color:#fff}
.hero .v small{font-size:16px;color:var(--mut);margin-inline-start:6px}
.hero .sub{font-size:13px;color:var(--cy)}
.spark{width:100%;height:90px;margin-top:10px;display:block}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.kpi{padding:14px 16px}
.kpi .l{font-size:12px;color:var(--mut)}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px}
.kpi .v.pk{color:var(--pkl)}.kpi .v.cy{color:var(--cy)}
.row2{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
.budget{padding:18px;display:flex;align-items:center;gap:18px}
.ring{width:110px;height:110px;flex:none}
.budget .t{font-size:14px;font-weight:700}
.budget .d{font-size:12px;color:var(--mut);margin-top:4px;line-height:1.8}
h2{font-size:16px;font-weight:700;margin:22px 4px 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 span{font-size:12px;color:var(--mut);font-weight:400}
.prods{display:grid;gap:10px}
.prod{padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;transform-origin:center}
.prod .nm{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.prod .nm i{width:10px;height:10px;border-radius:50%;flex:none}
.prod .mg{font-size:20px;font-weight:700}
.prod .meta{grid-column:1/-1;display:flex;gap:14px;font-size:11.5px;color:var(--mut);flex-wrap:wrap}
.prod .meta b{color:#fff;font-weight:600}
.bar{grid-column:1/-1;height:8px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:8px}
.prod:hover{border-color:rgba(255,61,127,.45)}
.prod{transition:border-color .25s}
@media(min-width:900px){
 .grid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
 .kpis{grid-template-columns:repeat(4,1fr)}
 .row2{grid-template-columns:1fr}
 h2:first-child{margin-top:0}
}
</style></head><body>
<a class="back" href="../">‹ التصاميم</a><span class="demo-tag">بيانات تجريبية</span>
<div class="orbs"><i></i><i></i><i></i></div>

<div class="lock" id="lock"><div class="card glass">
 <img class="logo" src="../../logo.png" alt="فلاش ستور">
 <h1>المالية · ادخل رمزك</h1>
 <div id="padSlot"></div>
</div></div>

<main id="app">
 <div class="top"><img src="../../logo.png" alt="فلاش ستور"><span class="chip glass" id="month"></span></div>
 <div class="grid">
  <div>
   <section class="hero glass">
    <div class="l">صافي الشهر بعد كل المصاريف</div>
    <div class="v"><span class="n" id="net">0</span><small>ريال</small></div>
    <div class="sub" id="netSub"></div>
    <svg class="spark" id="spark" viewBox="0 0 320 90" preserveAspectRatio="none" aria-label="الصافي اليومي"></svg>
   </section>
   <div class="kpis">
    <div class="kpi glass"><div class="l">المبيعات</div><div class="v n" id="k1">0</div></div>
    <div class="kpi glass"><div class="l">الطلبات</div><div class="v n" id="k2">0</div></div>
    <div class="kpi glass"><div class="l">العائد على الإعلان</div><div class="v cy n" id="k3">0</div></div>
    <div class="kpi glass"><div class="l">هامش الربح</div><div class="v pk n" id="k4">0</div></div>
   </div>
   <div class="row2">
    <section class="budget glass">
     <svg class="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="12"/><circle id="ringArc" cx="60" cy="60" r="50" fill="none" stroke="url(#rg)" stroke-width="12" stroke-linecap="round" transform="rotate(-90 60 60)" stroke-dasharray="314.16" stroke-dashoffset="314.16"/><defs><linearGradient id="rg"><stop offset="0" stop-color="#00E5D4"/><stop offset="1" stop-color="#FF3D7F"/></linearGradient></defs><text x="60" y="66" text-anchor="middle" fill="#fff" font-size="22" font-weight="700" id="ringTxt">0%</text></svg>
     <div><div class="t">ميزانية الإعلان</div><div class="d" id="budTxt"></div></div>
    </section>
   </div>
  </div>
  <div>
   <h2>هوامش الربح لكل منتج <span>الأعلى صافي أولًا</span></h2>
   <div class="prods" id="prods"></div>
  </div>
 </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../core.js"></script>
<script>
const {P,days,per,T,BUDGET,fmt,countUp,lock,padHTML,reduce,monthAr}=FIN;
document.getElementById("padSlot").outerHTML=padHTML;
document.getElementById("month").textContent=monthAr;
// sparkline
(function(){const s=document.getElementById("spark"),vals=days.map(d=>d.net),mx=Math.max(...vals),mn=Math.min(0,...vals);
 const x=i=>320-(i/(vals.length-1))*320, y=v=>82-((v-mn)/(mx-mn||1))*72;
 const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`);
 s.innerHTML=`<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF3D7F" stop-opacity=".45"/><stop offset="1" stop-color="#FF3D7F" stop-opacity="0"/></linearGradient></defs>
 <polygon points="320,90 ${pts.join(" ")} 0,90" fill="url(#sg)" id="sa"/>
 <polyline points="${pts.join(" ")}" fill="none" stroke="#FF7AA6" stroke-width="2.5" stroke-linejoin="round" id="sl"/>`;
})();
// products
const box=document.getElementById("prods");
per.forEach(p=>{const el=document.createElement("div");el.className="prod glass";
 el.innerHTML=`<div class="nm"><i style="background:${p.color};box-shadow:0 0 10px ${p.color}"></i><span></span></div>
 <div class="mg n" data-m="${p.margin}">0%</div>
 <div class="meta"><span>السعر <b class="n">${fmt(p.price,2)}</b></span><span>التكلفة <b class="n">${fmt(p.cost,2)}</b></span><span>انباع <b class="n">${fmt(p.qty)}</b></span><span>الصافي <b class="n">${fmt(p.net)}</b></span></div>
 <div class="bar"><i style="background:linear-gradient(90deg,${p.color},#FF3D7F)"></i></div>`;
 el.querySelector(".nm span").textContent=p.name; box.appendChild(el);});

function open(){
 const app=document.getElementById("app");
 countUp(document.getElementById("net"),T.net);
 document.getElementById("netSub").textContent=`بعد المورد ورسوم سلة والإعلان والمصاريف الثابتة`;
 countUp(document.getElementById("k1"),T.sales);
 countUp(document.getElementById("k2"),T.orders);
 countUp(document.getElementById("k3"),T.roas,1,1.4,"","x");
 countUp(document.getElementById("k4"),T.margin*100,0,1.4,"","%");
 document.getElementById("budTxt").innerHTML=`صرفت <b class="n">${fmt(T.ad)}</b> من <b class="n">${fmt(BUDGET)}</b><br>المتبقي <b class="n" style="color:var(--cy)">${fmt(T.budgetLeft)}</b> ريال`;
 const arc=document.getElementById("ringArc"),off=314.16*(1-T.budgetUsed),rt=document.getElementById("ringTxt");
 document.querySelectorAll(".prod").forEach((el,i)=>{const m=+el.querySelector(".mg").dataset.m;el._m=m});
 if(reduce||!window.gsap){app.style.opacity=1;arc.setAttribute("stroke-dashoffset",off);rt.textContent=Math.round(T.budgetUsed*100)+"%";
  document.querySelectorAll(".prod").forEach(el=>{el.querySelector(".bar i").style.width=(el._m*100)+"%";el.querySelector(".mg").textContent=Math.round(el._m*100)+"%"});return}
 const tl=gsap.timeline();
 tl.to(app,{opacity:1,duration:.4})
   .from(".hero,.kpi,.budget",{y:30,opacity:0,stagger:.07,duration:.7,ease:"power3.out"},"<")
   .from(".prod",{y:24,opacity:0,stagger:.08,duration:.6,ease:"power3.out"},"-=.4");
 const sl=document.getElementById("sl"),len=sl.getTotalLength();
 gsap.fromTo(sl,{strokeDasharray:len,strokeDashoffset:len},{strokeDashoffset:0,duration:1.6,ease:"power2.out",delay:.3});
 gsap.from("#sa",{opacity:0,duration:1.2,delay:.9});
 const o={p:0};gsap.to(o,{p:T.budgetUsed,duration:1.6,ease:"power3.out",delay:.4,onUpdate:()=>{arc.setAttribute("stroke-dashoffset",314.16*(1-o.p));rt.textContent=Math.round(o.p*100)+"%"}});
 document.querySelectorAll(".prod").forEach((el,i)=>{const m=el._m,b=el.querySelector(".bar i"),t=el.querySelector(".mg"),q={v:0};
  gsap.to(b,{width:(m*100)+"%",duration:1.2,ease:"power3.out",delay:.8+i*.08});
  gsap.to(q,{v:m*100,duration:1.2,delay:.8+i*.08,ease:"power3.out",onUpdate:()=>t.textContent=Math.round(q.v)+"%"});});
 gsap.to(".orbs i:nth-child(1)",{x:-40,y:30,duration:9,repeat:-1,yoyo:true,ease:"sine.inOut"});
 gsap.to(".orbs i:nth-child(2)",{x:50,y:-40,duration:11,repeat:-1,yoyo:true,ease:"sine.inOut"});
}
if(window.gsap&&!reduce)gsap.from(".lock .card",{y:40,opacity:0,scale:.96,duration:.8,ease:"power3.out"});
lock(document.getElementById("lock"),open);
</script>
</body></html>
