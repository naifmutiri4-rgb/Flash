<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0B0A12">
<title>فلاش المالية · المحفظة</title>
<link rel="stylesheet" href="../core.css">
<style>
body{background:linear-gradient(180deg,#120F22,#0B0A12 40%);min-height:100vh}
.lock{background:rgba(11,10,18,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);perspective:1000px}
.fcard{width:300px;height:180px;border-radius:22px;position:relative;transform-style:preserve-3d;background:linear-gradient(125deg,#00E5D4,#6E7FD6 45%,#FF3D7F);box-shadow:0 30px 60px rgba(255,61,127,.35);padding:18px;color:#0B0A12;overflow:hidden}
.fcard::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);animation:shine 3.2s infinite}
@keyframes shine{60%,100%{transform:translateX(120%)}}
.fcard .bolt{position:absolute;left:18px;top:14px;width:46px;height:46px;border-radius:14px;background:#0B0A12;display:grid;place-items:center;color:#FF3D7F;font-size:24px}
.fcard .t1{font-weight:700;font-size:20px}
.fcard .t2{font-size:12px;opacity:.75;margin-top:2px}
.fcard .nb{position:absolute;bottom:18px;right:18px;font-size:16px;letter-spacing:3px;font-weight:700;direction:ltr}
.lock .ttl{font-size:15px;color:var(--mut)}
main{max-width:520px;margin:0 auto;padding:54px 16px 60px;opacity:0}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.hd h1{font-size:24px}
.hd img{height:28px}
.sum{border-radius:26px;padding:20px;background:linear-gradient(125deg,#00E5D4 0%,#6E7FD6 45%,#FF3D7F 100%);color:#0B0A12;box-shadow:0 20px 40px rgba(255,61,127,.25);position:relative;overflow:hidden}
.sum .l{font-size:13px;font-weight:600;opacity:.75}
.sum .v{font-size:44px;font-weight:700;line-height:1.15}
.sum .row{display:flex;gap:10px;margin-top:12px}
.sum .row div{flex:1;background:rgba(11,10,18,.14);border-radius:14px;padding:8px 10px;backdrop-filter:blur(6px)}
.sum .row small{display:block;font-size:11px;opacity:.75}
.sum .row b{font-size:16px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 10px}
.sec h2{font-size:16px}.sec span{font-size:12px;color:var(--mut)}
.stack{position:relative}
.wc{border-radius:24px;padding:18px;margin-top:-118px;position:relative;cursor:pointer;color:#fff;border:1px solid rgba(255,255,255,.18);box-shadow:0 -10px 30px rgba(0,0,0,.45);transition:margin .45s cubic-bezier(.2,.8,.2,1),filter .3s;background:var(--g);min-height:170px;overflow:hidden}
.wc:first-child{margin-top:0}
.wc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.14),transparent 40%);pointer-events:none}
.wc .h{display:flex;justify-content:space-between;align-items:center}
.wc .nm{font-weight:700;font-size:17px}
.wc .pr{font-size:13px;background:rgba(0,0,0,.25);padding:4px 10px;border-radius:20px}
.wc .mg{font-size:38px;font-weight:700;margin-top:14px;line-height:1}
.wc .mg small{font-size:13px;font-weight:400;opacity:.8;margin-inline-start:6px}
.wc .det{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px;max-height:0;opacity:0;overflow:hidden;transition:max-height .45s,opacity .3s}
.wc .det div{background:rgba(0,0,0,.25);border-radius:12px;padding:8px 10px;font-size:11px;backdrop-filter:blur(4px)}
.wc .det b{display:block;font-size:16px;margin-top:2px}
.wc.open .det{max-height:200px;opacity:1}
.wc.open + .wc{margin-top:14px}
.wc:hover{filter:brightness(1.12)}
.hint2{text-align:center;font-size:12px;color:var(--mut);margin-top:16px}
</style></head><body>
<a class="back" href="../">‹ التصاميم</a><span class="demo-tag">بيانات تجريبية</span>
<div class="lock" id="lock">
 <div class="fcard" id="fc"><div class="bolt">⚡</div><div class="t1">فلاش ستور</div><div class="t2">بطاقة المالية</div><div class="nb">•••• 2027</div></div>
 <div class="ttl">ادخل رمزك لفتح المحفظة</div>
 <div id="padSlot"></div>
</div>
<main id="app">
 <div class="hd"><h1>محفظتي</h1><img src="../../logo.png" alt="فلاش ستور"></div>
 <section class="sum">
  <div class="l">صافي يناير 2027</div>
  <div class="v n" id="net">0</div>
  <div class="row">
   <div><small>المبيعات</small><b class="n" id="s1">0</b></div>
   <div><small>الطلبات</small><b class="n" id="s2">0</b></div>
   <div><small>باقي الميزانية</small><b class="n" id="s3">0</b></div>
  </div>
 </section>
 <div class="sec"><h2>منتجاتك وهوامشها</h2><span>اضغط على أي بطاقة</span></div>
 <div class="stack" id="stack"></div>
 <div class="hint2">الهامش = (السعر − تكلفة المورد − رسوم سلة) ÷ السعر</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../core.js"></script>
<script>
const {per,T,fmt,countUp,lock,padHTML,reduce}=FIN;
document.getElementById("padSlot").outerHTML=padHTML;
const st=document.getElementById("stack");
per.forEach((p,i)=>{const c=document.createElement("div");c.className="wc";
 c.style.setProperty("--g",`linear-gradient(135deg,${p.color},#2A1240 85%)`);c.style.zIndex=i+1;
 c.innerHTML=`<div class="h"><span class="nm"></span><span class="pr n">${fmt(p.price,2)} ر.س</span></div>
 <div class="mg"><span class="n mv">0%</span><small>هامش ربح</small></div>
 <div class="det"><div>تكلفة المورد<b class="n">${fmt(p.cost,2)}</b></div><div>صافي الطلب الواحد<b class="n">${fmt(p.price*p.margin,2)}</b></div><div>انباع هذا الشهر<b class="n">${fmt(p.qty)}</b></div><div>صافي الشهر منه<b class="n">${fmt(p.net)}</b></div></div>`;
 c.querySelector(".nm").textContent=p.name;c.dataset.m=p.margin;
 c.addEventListener("click",()=>{const was=c.classList.contains("open");st.querySelectorAll(".wc").forEach(x=>x.classList.remove("open"));if(!was)c.classList.add("open")});
 c.tabIndex=0;c.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();c.click()}});
 st.appendChild(c)});
function open(){
 const app=document.getElementById("app");
 countUp(document.getElementById("net"),T.net);countUp(document.getElementById("s1"),T.sales);countUp(document.getElementById("s2"),T.orders);countUp(document.getElementById("s3"),T.budgetLeft);
 const cards=[...st.children];
 const setM=(c,v)=>c.querySelector(".mv").textContent=Math.round(v*100)+"%";
 if(reduce||!window.gsap){app.style.opacity=1;cards.forEach(c=>setM(c,+c.dataset.m));cards[0].classList.add("open");return}
 gsap.to(app,{opacity:1,duration:.3});
 gsap.from(".sum",{y:-30,rotateX:25,opacity:0,duration:.8,ease:"power3.out",transformPerspective:900});
 gsap.from(cards,{y:160,opacity:0,stagger:.09,duration:.8,delay:.25,ease:"power3.out"});
 cards.forEach((c,i)=>{const o={v:0};gsap.to(o,{v:+c.dataset.m,duration:1.2,delay:.5+i*.09,ease:"power2.out",onUpdate:()=>setM(c,o.v)})});
 setTimeout(()=>cards[0].classList.add("open"),1500);
}
if(window.gsap&&!reduce){gsap.from("#fc",{rotateY:-35,rotateX:12,y:40,opacity:0,duration:1,ease:"power3.out"});
 document.addEventListener("pointermove",e=>{const fc=document.getElementById("fc");if(!fc)return;gsap.to(fc,{rotateY:(e.clientX/innerWidth-.5)*20,rotateX:-(e.clientY/innerHeight-.5)*20,duration:.6})})}
lock(document.getElementById("lock"),open);
</script>
</body></html>
