<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0B0A12">
<title>فلاش المالية · التقويم الحراري</title>
<link rel="stylesheet" href="../core.css">
<style>
body{min-height:100vh;background:var(--bg)}
.lock{background:#0B0A12;overflow:hidden}
.lock .wave{position:absolute;inset:-20%;display:grid;grid-template-columns:repeat(10,1fr);gap:6px;opacity:.5;transform:rotate(-12deg)}
.lock .wave i{aspect-ratio:1;border-radius:6px;background:var(--card)}
.lock .box{position:relative;padding:24px 20px;border-radius:28px;background:rgba(22,20,42,.55);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;flex-direction:column;align-items:center;gap:18px}
.lock h1{font-size:19px}
main{max-width:1000px;margin:0 auto;padding:54px 16px 40px;opacity:0}
.hd{display:flex;justify-content:space-between;align-items:center}
.hd h1{font-size:22px}.hd img{height:28px}
.strip{display:flex;gap:10px;overflow-x:auto;margin:14px -16px 0;padding:0 16px 4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.st{flex:none;min-width:130px;padding:12px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.st .l{font-size:11px;color:var(--mut)}.st .v{font-size:22px;font-weight:700;margin-top:2px}
.st.hl{background:linear-gradient(135deg,rgba(255,61,127,.35),rgba(22,20,42,.9));border-color:rgba(255,61,127,.5)}
.card{margin-top:14px;padding:16px;border-radius:24px;background:var(--card);border:1px solid var(--line)}
.card h2{font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.card h2 span{font-size:11px;color:var(--mut);font-weight:400}
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px;font-size:10px;color:var(--mut);text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
.cal button{aspect-ratio:1;border-radius:10px;font-size:12px;font-weight:600;position:relative;border:1px solid transparent;transition:border-color .2s}
.cal button.sel{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.cal .empty{visibility:hidden}
.legend{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:10px;font-size:10px;color:var(--mut)}
.legend i{width:14px;height:14px;border-radius:4px}
.day{margin-top:12px;padding:14px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--line2);display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.day .t{grid-column:1/-1;font-weight:700;font-size:14px;display:flex;justify-content:space-between}
.day .t b{color:var(--cy)}
.day div small{display:block;font-size:10.5px;color:var(--mut)}
.day div span{font-size:15px;font-weight:700}
.race{margin-top:12px;display:grid;gap:10px}
.rr{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;font-size:12.5px}
.rr .tr{height:26px;border-radius:9px;background:rgba(255,255,255,.05);overflow:hidden;position:relative}
.rr .tr i{position:absolute;inset:0 0 0 auto;width:0;border-radius:9px;display:flex;align-items:center;padding-inline-start:8px;font-size:11px;font-weight:700;color:#0B0A12;white-space:nowrap}
.rr .pc{font-weight:700;text-align:left}
@media(min-width:860px){.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.two .card{margin-top:14px}}
</style></head><body>
<a class="back" href="../">‹ التصاميم</a><span class="demo-tag">بيانات تجريبية</span>
<div class="lock" id="lock"><div class="wave" id="wave"></div>
 <div class="box"><img src="../../logo.png" alt="فلاش ستور" style="width:160px"><h1>ادخل رمزك</h1><div id="padSlot"></div></div></div>
<main id="app">
 <div class="hd"><h1>نبض يناير</h1><img src="../../logo.png" alt="فلاش ستور"></div>
 <div class="strip">
  <div class="st hl"><div class="l">الصافي</div><div class="v n" id="a1">0</div></div>
  <div class="st"><div class="l">المبيعات</div><div class="v n" id="a2">0</div></div>
  <div class="st"><div class="l">الطلبات</div><div class="v n" id="a3">0</div></div>
  <div class="st"><div class="l">العائد على الإعلان</div><div class="v n" id="a4">0</div></div>
  <div class="st"><div class="l">باقي الميزانية</div><div class="v n" id="a5">0</div></div>
 </div>
 <div class="two">
  <section class="card"><h2>صافي كل يوم <span>اضغط أي يوم</span></h2>
   <div class="wd"><span>أحد</span><span>إثن</span><span>ثلا</span><span>أرب</span><span>خمي</span><span>جمع</span><span>سبت</span></div>
   <div class="cal" id="cal"></div>
   <div class="legend"><span>أقل</span><i style="background:#2A2550"></i><i style="background:#1F6F78"></i><i style="background:#00B8AA"></i><i style="background:#00E5D4"></i><i style="background:#FF3D7F"></i><span>أعلى</span></div>
   <div class="day" id="day"></div>
  </section>
  <section class="card"><h2>سباق الهوامش <span>الشريط = صافي الشهر · الرقم = الهامش</span></h2><div class="race" id="race"></div></section>
 </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../core.js"></script>
<script>
const {P,days,per,T,fmt,countUp,lock,padHTML,reduce}=FIN;
document.getElementById("padSlot").outerHTML=padHTML;
document.getElementById("wave").innerHTML=Array.from({length:140},()=>"<i></i>").join("");
const nets=days.map(d=>d.net),mx=Math.max(...nets),mn=Math.min(...nets);
const col=v=>{const t=(v-mn)/(mx-mn||1);return t>.85?"#FF3D7F":t>.6?"#00E5D4":t>.4?"#00B8AA":t>.2?"#1F6F78":"#2A2550"};
const cal=document.getElementById("cal");const first=days[0].date.getDay();
cal.innerHTML=Array.from({length:first},()=>'<span class="empty"></span>').join("")+days.map((d,i)=>`<button data-i="${i}" style="background:${col(d.net)};color:${(d.net-mn)/(mx-mn)>.4?'#0B0A12':'#fff'}" aria-label="يوم ${d.day}">${d.day}</button>`).join("");
const dayBox=document.getElementById("day");
function showDay(i){const d=days[i];cal.querySelectorAll("button").forEach(b=>b.classList.toggle("sel",+b.dataset.i===i));
 const nm=d.date.toLocaleDateString("ar-SA-u-ca-gregory-nu-latn",{weekday:"long",day:"numeric",month:"long"});
 const top=P.map(p=>[p.name,d.counts[p.id]]).sort((a,b)=>b[1]-a[1])[0];
 dayBox.innerHTML=`<div class="t"><span></span><b class="n">${fmt(d.net,2)}</b></div><div><small>الطلبات</small><span class="n">${d.orders}</span></div><div><small>المبيعات</small><span class="n">${fmt(d.sales)}</span></div><div><small>الأكثر طلبًا</small><span class="tp"></span></div>`;
 dayBox.querySelector(".t span").textContent=nm;dayBox.querySelector(".tp").textContent=top[0].replace("بكج ","");
 if(window.gsap&&!reduce)gsap.fromTo(dayBox,{y:8,opacity:.4},{y:0,opacity:1,duration:.35})}
cal.addEventListener("click",e=>{const b=e.target.closest("button");if(b)showDay(+b.dataset.i)});
const best=nets.indexOf(mx);showDay(best);
const mxNet=Math.max(...per.map(p=>p.net));
document.getElementById("race").innerHTML=per.map(p=>`<div class="rr"><span class="nm"></span><div class="tr"><i data-w="${p.net/mxNet*100}" style="background:${p.color}"><span class="n">${fmt(p.net)}</span></i></div><span class="pc n">${Math.round(p.margin*100)}%</span></div>`).join("");
document.querySelectorAll(".rr .nm").forEach((n,i)=>n.textContent=per[i].name.replace("بكج ",""));
function open(){
 const app=document.getElementById("app"),bars=document.querySelectorAll(".rr .tr i"),cells=cal.querySelectorAll("button");
 countUp(document.getElementById("a1"),T.net);countUp(document.getElementById("a2"),T.sales);countUp(document.getElementById("a3"),T.orders);countUp(document.getElementById("a4"),T.roas,1,1.4,"","x");countUp(document.getElementById("a5"),T.budgetLeft);
 if(reduce||!window.gsap){app.style.opacity=1;bars.forEach(b=>b.style.width=b.dataset.w+"%");return}
 gsap.to(app,{opacity:1,duration:.3});
 gsap.from(".st",{y:20,opacity:0,stagger:.06,duration:.5});
 gsap.from(cells,{scale:0,opacity:0,duration:.45,ease:"back.out(2.4)",stagger:{each:.025,grid:[5,7],from:"start"},delay:.2});
 gsap.from(".card",{y:30,opacity:0,stagger:.12,duration:.7,ease:"power3.out"});
 gsap.to(bars,{width:i=>bars[i].dataset.w+"%",duration:1.4,stagger:.12,delay:.7,ease:"power4.out"});
}
if(window.gsap&&!reduce){gsap.to("#wave i",{background:i=>["#16142A","#2A2550","rgba(255,61,127,.35)","rgba(0,229,212,.3)"][i%7%4],duration:1.6,repeat:-1,yoyo:true,stagger:{each:.02,from:"random"}});gsap.from(".lock .box",{y:30,opacity:0,duration:.8})}
lock(document.getElementById("lock"),open);
</script>
</body></html>
