<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0B0A12">
<title>فلاش المالية · القصص</title>
<link rel="stylesheet" href="../core.css">
<style>
html,body{height:100%;overflow:hidden}
.lock{background:radial-gradient(60% 40% at 50% 30%,rgba(255,61,127,.35),transparent 70%),#0B0A12}
.lock .av{width:110px;height:110px;border-radius:50%;padding:4px;background:conic-gradient(from 0deg,#00E5D4,#FF3D7F,#7C5CFF,#00E5D4);animation:spin 4s linear infinite}
.lock .av img{width:100%;height:100%;border-radius:50%;border:4px solid #0B0A12;display:block;animation:spin 4s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.lock h1{font-size:18px}
.wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;opacity:0}
.story{position:relative;width:100%;height:100%;max-width:460px;max-height:900px;overflow:hidden;background:#0B0A12}
@media(min-width:600px){.story{border-radius:28px;height:92vh;border:1px solid var(--line);box-shadow:0 30px 80px rgba(255,61,127,.2)}}
.bars{position:absolute;top:14px;left:12px;right:12px;display:flex;gap:4px;z-index:5;direction:rtl}
.bars span{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
.bars span i{display:block;height:100%;width:0;background:#fff;border-radius:3px}
.who{position:absolute;top:26px;right:14px;left:14px;z-index:5;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.who img{width:30px;height:30px;border-radius:50%}
.who small{color:var(--mut);font-weight:400}
.slide{position:absolute;inset:0;padding:96px 26px 60px;display:flex;flex-direction:column;justify-content:center;gap:14px;visibility:hidden}
.slide.on{visibility:visible}
.slide .k{font-size:14px;color:var(--mut)}
.slide .big{font-size:64px;font-weight:700;line-height:1.05}
.slide .big small{font-size:18px;color:var(--mut);margin-inline-start:8px}
.slide .msg{font-size:17px;line-height:1.7}
.slide .msg b{color:var(--cy)}
.bg1{background:radial-gradient(80% 60% at 80% 10%,rgba(255,61,127,.55),transparent 60%),radial-gradient(70% 50% at 0% 100%,rgba(0,229,212,.35),transparent 60%),#0B0A12}
.bg2{background:linear-gradient(160deg,#00E5D4 0%,#0B6E7A 45%,#0B0A12 85%)}
.bg3{background:radial-gradient(100% 70% at 50% 0%,#3A1E6E,transparent 70%),#0B0A12}
.bg4{background:linear-gradient(200deg,#FF3D7F,#5A1238 55%,#0B0A12)}
.bg5{background:radial-gradient(80% 50% at 50% 100%,rgba(255,201,77,.4),transparent 60%),#0B0A12}
.gl{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:20px;padding:14px 16px}
.mgs{display:grid;gap:9px}
.mg{display:grid;grid-template-columns:110px 1fr 40px;align-items:center;gap:10px;font-size:13px}
.mg .t{height:10px;border-radius:10px;background:rgba(255,255,255,.1);overflow:hidden}
.mg .t i{display:block;height:100%;width:0;border-radius:10px}
.mg b{text-align:left}
.ring{width:190px;height:190px;align-self:center}
.tap{position:absolute;top:80px;bottom:0;width:40%;z-index:4}
.tap.prev{right:0}.tap.next{left:0}
.foot{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:12px;color:rgba(255,255,255,.55);z-index:5}
.pause{position:absolute;top:24px;left:14px;z-index:6;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.12);font-size:12px}
</style></head><body>
<a class="back" href="../" style="top:auto;bottom:10px">‹ التصاميم</a><span class="demo-tag" style="top:auto;bottom:10px">بيانات تجريبية</span>
<div class="lock" id="lock"><div class="av"><img src="../../logo-icon.png" alt=""></div><h1>ملخص شهرك جاهز · ادخل رمزك</h1><div id="padSlot"></div></div>
<div class="wrap" id="app"><div class="story" id="story">
 <div class="bars" id="bars"></div>
 <div class="who"><img src="../../logo-icon.png" alt=""><span>فلاش ستور <small>· ملخص يناير</small></span></div>
 <button class="pause" id="pause" aria-label="إيقاف مؤقت">❚❚</button>
 <section class="slide bg1"><div class="k">صافي يناير بعد كل شي</div><div class="big"><span class="n" data-c="net">0</span><small>ريال</small></div><div class="msg">من <b class="n" data-f="sales"></b> ريال مبيعات و<b class="n" data-f="orders"></b> طلب.</div></section>
 <section class="slide bg2"><div class="k" style="color:#0B0A12;font-weight:600">نجم الشهر</div><div class="big" id="star" style="font-size:48px"></div><div class="gl msg" id="starMsg"></div></section>
 <section class="slide bg3"><div class="k">هامش الربح لكل منتج</div><div class="mgs" id="mgs"></div><div class="msg" style="font-size:14px;color:var(--mut)">الهامش = اللي يبقى لك من كل ريال بعد المورد ورسوم سلة.</div></section>
 <section class="slide bg4"><div class="k" style="color:#fff">ميزانية الإعلان</div>
  <svg class="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="10"/><circle id="arc" cx="60" cy="60" r="50" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" transform="rotate(-90 60 60)" stroke-dasharray="314.16" stroke-dashoffset="314.16"/><text x="60" y="58" text-anchor="middle" fill="#fff" font-size="24" font-weight="700" id="arcT">0%</text><text x="60" y="78" text-anchor="middle" fill="rgba(255,255,255,.7)" font-size="9">مصروف</text></svg>
  <div class="gl msg" id="adMsg"></div></section>
 <section class="slide bg5"><div class="k">أقوى يوم</div><div class="big" id="bestDay" style="font-size:44px"></div><div class="gl msg" id="bestMsg"></div></section>
 <div class="tap prev" id="tPrev"></div><div class="tap next" id="tNext"></div>
 <div class="foot">اضغط يمين للرجوع · يسار للتالي</div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../core.js"></script>
<script>
const {days,per,T,BUDGET,fmt,countUp,lock,padHTML,reduce}=FIN;
document.getElementById("padSlot").outerHTML=padHTML;
const slides=[...document.querySelectorAll(".slide")],N=slides.length,DUR=5;
document.getElementById("bars").innerHTML=slides.map(()=>"<span><i></i></span>").join("");
const bars=[...document.querySelectorAll(".bars i")];
document.querySelector('[data-f="sales"]').textContent=fmt(T.sales);document.querySelector('[data-f="orders"]').textContent=fmt(T.orders);
const s=per[0];document.getElementById("star").textContent=s.name;
document.getElementById("starMsg").innerHTML=`جاب لك <b class="n">${fmt(s.net)}</b> ريال صافي من <b class="n">${fmt(s.qty)}</b> طلب، وهامشه <b class="n">${Math.round(s.margin*100)}%</b>.`;
document.getElementById("mgs").innerHTML=per.map(p=>`<div class="mg"><span></span><div class="t"><i style="background:${p.color}" data-w="${p.margin*100}"></i></div><b class="n">${Math.round(p.margin*100)}%</b></div>`).join("");
document.querySelectorAll(".mg span").forEach((x,i)=>x.textContent=per[i].name.replace("بكج ",""));
document.getElementById("adMsg").innerHTML=`صرفت <b class="n">${fmt(T.ad)}</b> من <b class="n">${fmt(BUDGET)}</b>، وكل ريال إعلان رجّع <b class="n">${fmt(T.roas,1)}</b> ريال مبيعات.`;
const bd=days.reduce((a,b)=>b.net>a.net?b:a);document.getElementById("bestDay").textContent=bd.date.toLocaleDateString("ar-SA-u-ca-gregory-nu-latn",{weekday:"long",day:"numeric",month:"long"});
document.getElementById("bestMsg").innerHTML=`<b class="n">${bd.orders}</b> طلب و<b class="n">${fmt(bd.net)}</b> ريال صافي في يوم واحد.`;
let cur=-1,tw=null,paused=false;
function enter(i){const sl=slides[i];
 if(i===0)countUp(sl.querySelector('[data-c="net"]'),T.net,0,1.6);
 if(i===2)sl.querySelectorAll(".mg i").forEach((b,k)=>{if(reduce||!window.gsap){b.style.width=b.dataset.w+"%"}else gsap.fromTo(b,{width:0},{width:b.dataset.w+"%",duration:1,delay:.2+k*.08,ease:"power3.out"})});
 if(i===3){const a=document.getElementById("arc"),t=document.getElementById("arcT");if(reduce||!window.gsap){a.setAttribute("stroke-dashoffset",314.16*(1-T.budgetUsed));t.textContent=Math.round(T.budgetUsed*100)+"%"}else{const o={p:0};gsap.to(o,{p:T.budgetUsed,duration:1.4,ease:"power3.out",onUpdate:()=>{a.setAttribute("stroke-dashoffset",314.16*(1-o.p));t.textContent=Math.round(o.p*100)+"%"}})}}
 if(window.gsap&&!reduce)gsap.fromTo(sl.children,{y:30,opacity:0,filter:"blur(6px)"},{y:0,opacity:1,filter:"blur(0px)",stagger:.12,duration:.6,ease:"power3.out"});
}
function go(i){if(i<0)i=0;if(i>=N){i=0}
 slides.forEach((x,k)=>x.classList.toggle("on",k===i));
 bars.forEach((b,k)=>{if(k<i)b.style.width="100%";else b.style.width="0%"});
 cur=i;enter(i);
 if(tw)tw.kill();
 if(!window.gsap){bars[i].style.width="100%";return}
 tw=gsap.fromTo(bars[i],{width:"0%"},{width:"100%",duration:DUR,ease:"none",onComplete:()=>go(cur+1)});
 if(paused)tw.pause();
}
document.getElementById("tNext").onclick=()=>go(cur+1);
document.getElementById("tPrev").onclick=()=>go(cur-1);
document.getElementById("pause").onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?"▶":"❚❚";if(tw)paused?tw.pause():tw.resume()};
addEventListener("keydown",e=>{if(e.key==="ArrowLeft")go(cur+1);if(e.key==="ArrowRight")go(cur-1)});
function open(){const app=document.getElementById("app");if(window.gsap&&!reduce){gsap.fromTo(app,{opacity:0,scale:.92},{opacity:1,scale:1,duration:.6,ease:"power3.out"})}else app.style.opacity=1;go(0)}
if(window.gsap&&!reduce)gsap.from(".lock .av,.lock h1",{y:20,opacity:0,stagger:.1,duration:.7});
lock(document.getElementById("lock"),open);
</script>
</body></html>
