<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="فلاش ستور">
  <!-- شاشة تحميل «بث مباشر»: الشعار يكبر، البرق يترسم، نقطة LIVE تنبض، وشريط بتدرّج سماوي ← وردي يمتلئ. SMIL بدون جافاسكربت -->
  <style>
    .t{font:700 25px "IBM Plex Sans Arabic","SF Arabic","Geeza Pro","Noto Kufi Arabic",Tahoma,sans-serif;fill:#FFFFFF}
    .s{font:700 10px "Space Grotesk","Segoe UI",Arial,sans-serif;letter-spacing:4px;fill:#C2BEDD}
  </style>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00E5D4"/><stop offset="1" stop-color="#FF3D7F"/></linearGradient>
    <linearGradient id="bar" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#00E5D4"/><stop offset="1" stop-color="#FF3D7F"/></linearGradient>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FF3D7F" stop-opacity=".45"/><stop offset="1" stop-color="#FF3D7F" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#00E5D4" stop-opacity=".4"/><stop offset="1" stop-color="#00E5D4" stop-opacity="0"/></radialGradient>
    <clipPath id="bc"><rect x="70" y="212" width="100" height="5" rx="2.5"/></clipPath>
  </defs>

  <circle cx="92" cy="80" r="70" fill="url(#g1)" opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".6s" begin=".2s" fill="freeze"/></circle>
  <circle cx="150" cy="104" r="64" fill="url(#g2)" opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".6s" begin=".35s" fill="freeze"/></circle>

  <g transform="translate(120 90)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="0.55;1.08;1" keyTimes="0;.6;1" dur=".5s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1;.4 0 .2 1"/>
      <rect x="-46" y="-46" width="92" height="92" rx="26" fill="url(#tile)"/>
      <rect x="-46" y="-46" width="92" height="46" rx="26" fill="#fff" opacity=".12"/>
      <path d="M6 -32 -20 6h18l-5 28 28-39H4z" fill="#0B0A12" fill-opacity="0" stroke="#0B0A12" stroke-width="4" stroke-linejoin="round" stroke-dasharray="200" stroke-dashoffset="200">
        <animate attributeName="stroke-dashoffset" from="200" to="0" dur=".45s" begin=".3s" fill="freeze"/>
        <animate attributeName="fill-opacity" from="0" to="1" dur=".2s" begin=".7s" fill="freeze"/>
      </path>
      <circle cx="30" cy="-29" r="7" fill="#fff"/>
      <circle cx="30" cy="-29" r="4" fill="#FF3D7F"><animate attributeName="r" values="4;5.5;4" dur="1s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <text class="t" x="120" y="172" text-anchor="middle" direction="rtl" opacity="0">فلاش ستور<animate attributeName="opacity" from="0" to="1" dur=".35s" begin=".55s" fill="freeze"/></text>
  <text class="s" x="122" y="192" text-anchor="middle" opacity="0">FLASH STORE<animate attributeName="opacity" from="0" to="1" dur=".35s" begin=".7s" fill="freeze"/></text>

  <rect x="70" y="212" width="100" height="5" rx="2.5" fill="#2A2550"/>
  <g clip-path="url(#bc)">
    <rect x="170" y="212" width="0" height="5" fill="url(#bar)">
      <animate attributeName="width" values="0;70;100" keyTimes="0;.6;1" dur="1s" begin=".2s" fill="freeze"/>
      <animate attributeName="x" values="170;100;70" keyTimes="0;.6;1" dur="1s" begin=".2s" fill="freeze"/>
    </rect>
  </g>
</svg>
