<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="فلاش ستور">
  <!-- شاشة تحميل فلاش ستور: البرق «يضرب» داخل المربع البرتقالي، ثم يلمع، والشريط تحته يمتلئ. SMIL بدون جافاسكربت -->
  <style>
    .t{font:800 26px "SF Arabic","Geeza Pro","Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif;fill:#FFFFFF}
    .s{font:500 13px "SF Arabic","Geeza Pro","Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif;fill:#B8B8B8}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FC9E01" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FC9E01" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC04D"/>
      <stop offset="1" stop-color="#FC9E01"/>
    </linearGradient>
    <clipPath id="bar"><rect x="70" y="214" width="100" height="4" rx="2"/></clipPath>
  </defs>

  <!-- توهج خلفي ينبض -->
  <circle cx="120" cy="92" r="78" fill="url(#glow)" opacity="0">
    <animate attributeName="opacity" values="0;1;.55;1" keyTimes="0;.35;.7;1" dur="1.6s" begin=".25s" fill="freeze"/>
    <animate attributeName="r" values="60;82;74;82" dur="2.4s" begin=".25s" repeatCount="indefinite"/>
  </circle>

  <!-- المربع البرتقالي (علامة فلاش) يكبر من الوسط -->
  <g transform="translate(120 92)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="0.6;1.08;1" keyTimes="0;.6;1" dur=".5s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1;.4 0 .2 1"/>
      <rect x="-46" y="-46" width="92" height="92" rx="24" fill="url(#tile)"/>
      <!-- البرق: يترسم كخط ثم ينملي -->
      <path d="M8 -32 -22 6h20l-6 26 30-38H2z" fill="#111111" fill-opacity="0" stroke="#111111" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="210" stroke-dashoffset="210">
        <animate attributeName="stroke-dashoffset" from="210" to="0" dur=".45s" begin=".3s" fill="freeze"/>
        <animate attributeName="fill-opacity" from="0" to="1" dur=".2s" begin=".7s" fill="freeze"/>
      </path>
    </g>
  </g>

  <!-- لمعة تمر على المربع -->
  <rect x="60" y="40" width="22" height="110" rx="11" fill="#FFFFFF" opacity="0" transform="skewX(-18)">
    <animate attributeName="opacity" values="0;.35;0" dur=".5s" begin=".85s" fill="freeze"/>
    <animate attributeName="x" from="70" to="190" dur=".5s" begin=".85s" fill="freeze"/>
  </rect>

  <!-- الاسم -->
  <text class="t" x="120" y="176" text-anchor="middle" direction="rtl" opacity="0">فلاش ستور
    <animate attributeName="opacity" from="0" to="1" dur=".35s" begin=".55s" fill="freeze"/>
  </text>
  <text class="s" x="120" y="198" text-anchor="middle" direction="rtl" opacity="0">خدمات تيك توك
    <animate attributeName="opacity" from="0" to="1" dur=".35s" begin=".7s" fill="freeze"/>
  </text>

  <!-- شريط التحميل -->
  <rect x="70" y="214" width="100" height="4" rx="2" fill="#343434"/>
  <g clip-path="url(#bar)">
    <rect x="70" y="214" width="0" height="4" rx="2" fill="#FC9E01">
      <animate attributeName="width" values="0;70;100" keyTimes="0;.6;1" dur="1s" begin=".2s" fill="freeze"/>
    </rect>
  </g>
</svg>
