<!doctype html>
<html lang="ar-SA" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f1f2c">
  <title>فلاش ستور | FLASH STORE</title>

  <style>
    @font-face {
      font-family: "Thmanyah Sans";
      src: url("https://cdn.jsdelivr.net/gh/engdawood/thmanyah-font-web@4266a9d/fonts/thmanyah-sans/woff2/thmanyah-sans-Regular.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: "Thmanyah Sans";
      src: url("https://cdn.jsdelivr.net/gh/engdawood/thmanyah-font-web@4266a9d/fonts/thmanyah-sans/woff2/thmanyah-sans-Bold.woff2") format("woff2");
      font-style: normal;
      font-weight: 700;
      font-display: swap;
    }

    :root {
      color-scheme: dark;
      --bg: #1f1f2c;
      --gold: #fdd407;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: #fff;
      font: 1rem/1.7 "Thmanyah Sans", Tahoma, "Geeza Pro", Arial, sans-serif;
    }

    main {
      width: min(100%, 560px);
      padding-block: 38px;
      text-align: center;
    }

    .logo {
      display: block;
      width: min(82%, 350px);
      height: auto;
      margin: 0 auto 22px;
      color: var(--gold);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 8vw, 3.7rem);
    }

    p {
      margin: 4px 0 26px;
      color: #d5d5df;
    }

    .button {
      display: inline-flex;
      width: min(100%, 300px);
      min-height: 60px;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 12px 20px;
      border-radius: 14px;
      background: var(--gold);
      color: var(--bg);
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: none;
    }

    .button:hover { background: #ffec69; }

    .button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 5px;
    }
  </style>
</head>

<body>
  <main>
    <svg class="logo" viewBox="172 427 977 445" role="img"
         aria-labelledby="logo-title" fill="currentColor">
      <title id="logo-title">شعار فلاش</title>
      <path d="M343 431h156L378 553l-66 20 114-4 43 96L177 865l147-217-40 35h-64l-37-93z"/>
      <path d="M538 534h103l-7 34h-63l-4 18h55l-7 33h-55l-10 49h-39z"/>
      <path d="M649 534h40l-20 99h60l-7 35H621z"/>
      <path fill-rule="evenodd"
            d="M809 534h38l22 134h-42l-3-24h-44l-14 24h-44zm10 84-4-39-22 39z"/>
      <path d="M960 575c1-10-4-14-16-14-9 0-15 4-16 9-1 6 4 8 20 13 30 8 47 18 43 43-5 29-30 46-67 46-36 0-58-15-53-48h42c-1 12 5 17 18 17 10 0 17-4 18-10 1-6-4-9-20-14-30-9-45-18-41-41 5-28 30-45 65-45 34 0 51 16 46 44z"/>
      <path d="M1019 534h41l-9 49h44l10-49h40l-28 134h-40l11-51h-44l-11 51h-41z"/>
    </svg>

    <h1>فلاش ستور</h1>
    <p>تصفّح المتجر واطّلع على تفاصيل الخدمات المتاحة.</p>

    <a class="button" href="https://flashstore-ksa.com/ar">
      دخول المتجر <span aria-hidden="true">←</span>
    </a>
  </main>
</body>
</html>
